<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>真实数据分析 · MedRoundTable</title>
  <style>
    :root{--navy:#10243e;--blue:#2563a6;--ink:#233c5a;--muted:#6b7f98;--line:#dbe6f1;--bg:#f4f8fc;--green:#16836a;--amber:#b8781f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Noto Sans SC",system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:.12em;color:#6483a6;font-weight:700}.top h1{margin:5px 0;font-size:24px;color:var(--navy)}.top p{margin:0;color:var(--muted)}a{color:var(--blue)}.grid{display:grid;grid-template-columns:390px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 24px #31577d0d}.card h2{font-size:15px;margin:0 0 15px;color:var(--navy)}label{display:block;font-size:12px;font-weight:700;color:#526b88;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #cddbea;border-radius:8px;padding:10px;color:var(--ink);background:#fbfdff;font:inherit}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;margin-top:16px}.btn{border:1px solid #c5d8eb;background:#fff;color:var(--blue);border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:wait}.hint{margin-top:13px;color:var(--muted);font-size:11px}.status{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:15px}.status strong{color:var(--navy)}.badge{border-radius:999px;padding:4px 9px;font-size:11px;background:#edf3fa;color:#5d7693}.badge.green{background:#e8f7f1;color:var(--green)}.badge.amber{background:#fff3df;color:var(--amber)}.result{min-height:235px}.empty{display:grid;place-items:center;min-height:210px;color:#8ca0b6;text-align:center}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #edf2f7;font-size:12px}.kv b{color:#69819d}.report{margin-top:15px;background:#f6faff;border:1px solid #dbe9f7;border-radius:9px;padding:13px;font-size:12px}.report h3{font-size:13px;margin:0 0 7px}.danger{color:#9a5b18;font-size:11px;margin-top:13px}@media(max-width:800px){.shell{padding:16px}.grid{grid-template-columns:1fr}.top{display:block}.top .btn{margin-top:12px}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><div class="eyebrow">MEDROUNDTABLE LOCAL · REAL DATA RUN</div><h1>真实数据分析任务</h1><p>网页创建任务，Windows connector 后台执行，本页展示脱敏结果与论文草稿。</p></div><a href="index.html">返回 MedRoundTable</a></header>
  <div class="grid"><section class="card"><h2>创建分析项目</h2><form id="jobForm"><label for="title">项目名称</label><input id="title" required value="gutMGene 肠道微生物—代谢物关联探索"><label for="dataset">数据集 ID</label><input id="dataset" required value="gutMGene"><label for="analysis">分析路径</label><select id="analysis"><option value="/api/analyze/quick">快速全表扫描</option><option value="/api/analyze/auto">自动分析</option><option value="/api/analyze/hybrid">混合分析</option></select><label for="question">研究问题</label><textarea id="question" required>描述 gutMGene 中肠道微生物与代谢物关联的分布特征，并标记需要人工核验的结果。</textarea><div class="actions"><button class="btn primary" id="submit" type="submit">创建真实任务</button><button class="btn" id="refresh" type="button">刷新状态</button></div></form><p class="hint">任务只允许调用已登记分析路径；原始行、文件内容和 Ollama 上下文不得回传。</p><p class="danger">首次真实运行建议先审阅 schema 和数据质量报告，再允许自动分析继续。</p></section><section class="card result"><div class="status"><strong>任务状态</strong><span class="badge" id="badge">尚未创建</span></div><div id="output" class="empty">创建任务后，这里会显示 job_id、connector 状态、审计 ID、结果摘要和论文草稿。</div></section></div>
</main><script>
const API=window.MRT_API_BASE||'/api/v1';let jobId=null;const $=id=>document.getElementById(id);function badge(status){$('badge').textContent=status;$('badge').className='badge '+(status==='completed'?'green':status==='failed'?'amber':'')}function render(job){jobId=job.job_id;badge(job.status);$('output').className='';$('output').innerHTML=`<div class="kv"><b>job_id</b><span>${job.job_id}</span></div><div class="kv"><b>数据集</b><span>${job.dataset_id}</span></div><div class="kv"><b>分析路径</b><span>${job.analysis_path}</span></div><div class="kv"><b>更新时间</b><span>${job.updated_at||job.created_at}</span></div>${job.audit_id?`<div class="kv"><b>审计 ID</b><span>${job.audit_id}</span></div>`:''}${job.error?`<div class="report"><h3>执行错误</h3><div>${job.error}</div></div>`:''}${job.result?`<div class="report"><h3>脱敏结果摘要</h3><pre>${JSON.stringify(job.result,null,2)}</pre></div>`:''}`};async function create(e){e.preventDefault();$('submit').disabled=true;try{const r=await fetch(API+'/local-jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value,dataset_id:$('dataset').value,analysis_path:$('analysis').value,payload:{question:$('question').value},requested_by:'medroundtable-web'})});if(!r.ok)throw new Error(await r.text());render(await r.json());poll()}catch(err){$('output').textContent='创建失败：'+err.message}finally{$('submit').disabled=false}}async function refresh(){if(!jobId)return;const r=await fetch(API+'/local-jobs/'+jobId);if(r.ok){const job=await r.json();render(job);if(['queued','running'].includes(job.status))setTimeout(refresh,5000)}}function poll(){setTimeout(refresh,1500)}$('jobForm').addEventListener('submit',create);$('refresh').addEventListener('click',refresh);
</script></body></html>
